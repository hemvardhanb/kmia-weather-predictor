name: Daily KMIA Weather Forecast

on:
  schedule:
    # Runs at 10:00 UTC (6:00 AM Eastern) every day
    - cron: '0 10 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit the forecast file
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn requests numpy
      
      - name: Run weather predictor
        run: |
          python weather_predictor.py
        env:
          # No secrets needed - all data sources are public
          USER_AGENT: "WeatherModelMIA/2.0 (github-actions)"
      
      - name: Check for forecast file
        run: |
          if [ -f prediction_log.json ]; then
            echo "Forecast log exists"
            cat prediction_log.json
          else
            echo "No forecast log found"
            exit 1
          fi
      
      - name: Commit and push forecast log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prediction_log.json
          git commit -m "Update forecast log: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}